<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoServer · 站点导航</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <meta name="description" content="SoServer 旗下站点导航 · 包含刺玫会服务器内容与独立工具" />
    <meta name="theme-color" content="#f5f5f0" />
</head>
<body>
    <div class="container">
        <!-- ============================================================ -->
        <!-- 品牌头部 -->
        <!-- ============================================================ -->
        <header class="site-header">
            <h1 class="site-title">SoServer</h1>
            <p class="site-subtitle">刺玫会服务器 · 工具集</p>
        </header>

        <!-- ============================================================ -->
        <!-- 刺玫会服务器 -->
        <!-- ============================================================ -->
        <section class="group">
            <h2 class="group-title">
                <i class="fas fa-crown"></i>
                刺玫会服务器
            </h2>
            <div class="card-grid">
                <a href="/wiki/" class="card">
                    <div class="card-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-name">Wiki</h3>
                        <p class="card-desc">服务器制度、处理报告、人物志、公会档案</p>
                    </div>
                    <div class="card-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>

                <a href="/survey/" class="card">
                    <div class="card-icon">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-name">Survey</h3>
                        <p class="card-desc">入服问卷，通过审核后获取服务器密码</p>
                    </div>
                    <div class="card-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>
            </div>
        </section>

        <!-- ============================================================ -->
        <!-- 独立工具 -->
        <!-- ============================================================ -->
        <section class="group">
            <h2 class="group-title">
                <i class="fas fa-toolbox"></i>
                独立工具
            </h2>
            <div class="card-grid">
                <a href="/key/" class="card">
                    <div class="card-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-name">Key · 密语</h3>
                        <p class="card-desc">纯浏览器端运行的密码学工具箱，22 种加解密方式</p>
                    </div>
                    <div class="card-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>

                <a href="/learn/" class="card">
                    <div class="card-icon">
                        <i class="fas fa-calculator"></i>
                    </div>
                    <div class="card-body">
                        <h3 class="card-name">Learn · 数学工具箱</h3>
                        <p class="card-desc">12 个数学计算模块，计算、求解、绘图、统计</p>
                    </div>
                    <div class="card-arrow">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                </a>
            </div>
        </section>

        <!-- ============================================================ -->
        <!-- 页脚 -->
        <!-- ============================================================ -->
        <footer class="site-footer">
            <p>&copy; 2026 SoServer · 由 <a href="https://github.com/SoServer" target="_blank">SoServer</a> 维护</p>
        </footer>
    </div>
</body>
</html>
